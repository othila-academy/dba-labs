# Le scénario du spike, dans le même devcontainer qu'en local : tests/infra/run.sh.
name: spike
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Les tests d'infrastructure jouent le project/ du tag base : il faut l'historique et les tags.
          fetch-depth: 0
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: tests/infra/run.sh
