# Qui peut se connecter, d'où, comment. En local, postgres seul, par peer (scripts/db initialise le serveur ainsi) ;
# par le réseau, chiffré (hostssl) et en SCRAM, pour tous.
local   all   postgres            peer
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
