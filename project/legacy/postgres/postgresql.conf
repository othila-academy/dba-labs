# Configuration du serveur hérité, durcie : mots de passe en SCRAM, connexions chiffrées, journal des connexions et des lenteurs.
listen_addresses = '*'
hba_file = '/etc/dba/legacy/postgres/pg_hba.conf'
ident_file = '/etc/dba/postgres/pg_ident.conf'
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/dba/legacy/postgres/server.crt'
ssl_key_file = '/etc/dba/legacy/postgres/server.key'
log_connections = on
log_disconnections = on
log_min_duration_statement = 500ms
