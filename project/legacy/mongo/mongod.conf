# Configuration du MongoDB hérité, durcie : authentification obligatoire ; TLS proposé (preferTLS, voir la fiche).
net:
  port: 27017
  bindIp: 0.0.0.0
  tls:
    mode: preferTLS
    certificateKeyFile: /etc/dba/legacy/mongo/server.pem
    CAFile: /etc/dba/legacy/mongo/server.crt
    allowConnectionsWithoutCertificates: true
security:
  authorization: enabled
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
